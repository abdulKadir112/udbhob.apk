<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3a24"/>
      <stop offset="50%" stop-color="#092819"/>
      <stop offset="100%" stop-color="#04150c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background App Icon Shape -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Twin Leaves on Top -->
  <g transform="translate(256, 120)" filter="url(#glow)">
    <!-- Left Leaf -->
    <path d="M 0 0 C -35 -20 -60 -50 -55 -85 C -25 -80 0 -50 0 0 Z" fill="url(#leafGrad)"/>
    <path d="M 0 0 C -15 -30 -35 -55 -45 -70" stroke="#bef264" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- Right Leaf -->
    <path d="M 0 0 C 35 -20 60 -50 55 -85 C 25 -80 0 -50 0 0 Z" fill="url(#leafGrad)"/>
    <path d="M 0 0 C 15 -30 35 -55 45 -70" stroke="#bef264" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Central Symbol: Bengali 'উ' structure & Growth Bars -->
  <!-- White Arch embracing -->
  <g filter="url(#glow)">
    <!-- Main White Curve of 'উ' -->
    <path d="M 170 145 C 250 140 310 145 320 155 C 330 170 290 220 265 240 C 240 260 270 290 290 310 C 260 340 180 345 155 270 C 145 230 150 180 170 145 Z" fill="#ffffff"/>
    
    <!-- Outer Golden Arrow Sweep Upward -->
    <path d="M 185 325 C 265 345 365 295 385 180 L 370 190 L 400 135 L 420 195 L 400 185 C 385 320 270 370 185 325 Z" fill="url(#goldGrad)"/>

    <!-- Bar Chart Inside -->
    <rect x="220" y="275" width="20" height="35" rx="5" fill="url(#barGrad)"/>
    <rect x="248" y="255" width="20" height="55" rx="5" fill="url(#barGrad)"/>
    <rect x="276" y="235" width="20" height="75" rx="5" fill="url(#barGrad)"/>
  </g>

  <!-- Typography: Udbhob (উদ্ভব) -->
  <text x="256" y="420" text-anchor="middle" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-weight="900" font-size="78">
    <tspan fill="#f59e0b">উ</tspan><tspan fill="#ffffff">দ্ভব</tspan>
  </text>

  <!-- Tagline: বিনিয়োগে গড়ি নতুন সম্ভাবনা -->
  <text x="256" y="458" text-anchor="middle" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-weight="500" font-size="18" fill="#a7f3d0" letter-spacing="1">
    — বিনিয়োগে গড়ি নতুন সম্ভাবনা —
  </text>
</svg>
